<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="太空射击游戏 - 一个刺激的HTML5射击游戏" />
    <title>🚀 太空射击游戏 🚀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        #gameCanvas {
            display: block;
            cursor: crosshair;
        }
        
        /* 加载动画 */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 1000;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 移动端优化 */
        @media (max-width: 768px) {
            body {
                touch-action: none;
            }
        }
        
        /* 全屏按钮 */
        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        /* 游戏说明 */
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            max-width: 300px;
            z-index: 100;
        }
        
        .instructions h3 {
            margin-bottom: 10px;
            color: #00ff00;
        }
        
        .instructions ul {
            list-style: none;
            padding-left: 0;
        }
        
        .instructions li {
            margin: 5px 0;
            padding-left: 15px;
            position: relative;
        }
        
        .instructions li::before {
            content: '▶';
            position: absolute;
            left: 0;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">游戏加载中...</div>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">全屏</button>
    <div class="instructions">
        <h3>🎮 游戏控制</h3>
        <ul>
            <li>WASD / 方向键：移动飞船</li>
            <li>P：暂停游戏</li>
            <li>R：重新开始</li>
            <li>M：音乐开关</li>
            <li>S：音效开关</li>
            <li>空格：开始游戏</li>
        </ul>
    </div>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        // 全屏功能
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('全屏请求失败:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        // 隐藏加载动画
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1000);
        });
        
        // 防止右键菜单
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // 防止双击选中
        document.addEventListener('dblclick', e => e.preventDefault());
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
