<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 太空射击（Three.js）</title>
    <style>
        html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
        #hud { position: fixed; inset: 0; pointer-events: none; }
        .top-left { position: absolute; top: 10px; left: 12px; color:#cfd8dc; font-weight:600; text-shadow: 0 0 8px rgba(0,255,255,.35); }
        .top-right { position: absolute; top: 10px; right: 12px; color:#cfd8dc; font-weight:600; text-shadow: 0 0 8px rgba(0,255,255,.35); }
        .bottom-center { position:absolute; left:50%; transform: translateX(-50%); bottom:10px; color:#90caf9; opacity:.9; font-size:14px; text-align:center; }
        .btn { pointer-events: auto; display:inline-block; background: linear-gradient(135deg, #00bcd4, #2962ff); color:#fff; padding:10px 16px; border-radius:12px; border:none; cursor:pointer; box-shadow:0 8px 24px rgba(41,98,255,.35); transition:.2s transform; font-weight:700; letter-spacing:.5px; }
        .btn:active { transform: translateY(1px); }
        #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background: radial-gradient(1200px 800px at 50% 40%, rgba(20,40,80,.35), rgba(0,0,0,.9)); color:#e3f2fd; text-align:center; gap: 18px; flex-direction:column; }
        #overlay h1 { margin:0; font-size:32px; letter-spacing:.5px; }
        #overlay p { margin:6px 0 16px; color:#b0bec5; }
        .hidden { display:none; }
    </style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
    <div class="top-left" id="score">Score: 0</div>
    <div class="top-right" id="time">Time: 0.0s</div>
    <div class="bottom-center">移动：W/A/S/D 或 方向键  · 自动射击：开启  · 暂停/继续：P</div>
</div>

<div id="overlay" class="">
    <h1>3D 太空射击</h1>
    <p>使用 <strong>W/A/S/D</strong> 或 <strong>方向键</strong> 移动，武器自动射击。存活越久，得分越高！</p>
    <button id="startBtn" class="btn">开始游戏</button>
</div>

<!-- Three.js from CDN -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
    (()=>{
        const canvas = document.getElementById('game');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Scene & Camera
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000010, 40, 180);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 8, 30);
        camera.lookAt(0, 0, 0);

        // Lights
        const hemi = new THREE.HemisphereLight(0x77aaff, 0x080820, 0.6);
        scene.add(hemi);
        const keyLight = new THREE.PointLight(0x33ccff, 1.2, 120);
        keyLight.position.set(10, 18, 18);
        scene.add(keyLight);

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for (let i=0;i<starCount;i++) {
            starPositions[i*3+0] = (Math.random()*2-1) * 150;
            starPositions[i*3+1] = (Math.random()*2-1) * 150;
            starPositions[i*3+2] = (Math.random()*2-1) * 180 - 40; // mostly in front
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.8, sizeAttenuation: true, depthWrite:false });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // Player ship (simple wedge)
        const player = new THREE.Group();
        const bodyGeo = new THREE.ConeGeometry(1, 3.2, 6);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, metalness:0.4, roughness:0.35 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = Math.PI/2;
        player.add(body);
        const wingGeo = new THREE.BoxGeometry(2.6, 0.1, 0.6);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, metalness:0.2, roughness:0.4 });
        const wing = new THREE.Mesh(wingGeo, wingMat);
        wing.position.set(0, -0.4, 0.1);
        player.add(wing);
        player.position.set(0, 0, 0);
        scene.add(player);

        // Thruster glow
        const thrusterGeo = new THREE.ConeGeometry(0.4, 1.2, 8);
        const thrusterMat = new THREE.MeshBasicMaterial({ color: 0x90caf9 });
        const thruster = new THREE.Mesh(thrusterGeo, thrusterMat);
        thruster.position.set(0, 0, 1.4);
        thruster.rotation.x = -Math.PI/2;
        player.add(thruster);

        // Bounds & input
        const bounds = { x: 12, y: 8, z: 0 };
        const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false, KeyW:false, KeyA:false, KeyS:false, KeyD:false };
        window.addEventListener('keydown', e=>{ if (keys.hasOwnProperty(e.code)) keys[e.code]=true; if(e.code==='KeyP') togglePause(); });
        window.addEventListener('keyup', e=>{ if (keys.hasOwnProperty(e.code)) keys[e.code]=false; });

        // Bullets
        const bullets = [];
        const bulletGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.2, 6);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

        function spawnBullet(){
            const m = new THREE.Mesh(bulletGeo, bulletMat);
            m.rotation.z = Math.PI/2;
            m.position.copy(player.position).add(new THREE.Vector3(0, 0, -1.6));
            m.userData.vz = -1.2; // speed per frame
            scene.add(m);
            bullets.push(m);
        }

        // Enemies
        const enemies = [];
        const enemyGeo = new THREE.DodecahedronGeometry(1.0, 0);
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff4081, metalness:0.2, roughness:0.6, emissive:0x150010, emissiveIntensity:0.6 });

        function spawnEnemy(){
            const m = new THREE.Mesh(enemyGeo, enemyMat.clone());
            m.position.set((Math.random()*2-1)*bounds.x*0.95, (Math.random()*2-1)*bounds.y*0.95, -80 - Math.random()*40);
            m.userData.vz = 0.35 + Math.random()*0.35; // speed toward camera
            m.userData.vx = (Math.random()*2-1) * 0.05;
            m.userData.vy = (Math.random()*2-1) * 0.05;
            scene.add(m);
            enemies.push(m);
        }

        // Explosions (simple particles)
        const explosions = [];
        function spawnExplosion(pos){
            const count = 36;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count*3);
            const velocities = new Float32Array(count*3);
            for(let i=0;i<count;i++){
                positions[i*3+0]=pos.x; positions[i*3+1]=pos.y; positions[i*3+2]=pos.z;
                const dir = new THREE.Vector3().randomDirection();
                velocities[i*3+0]=dir.x*(0.3+Math.random()*0.8);
                velocities[i*3+1]=dir.y*(0.3+Math.random()*0.8);
                velocities[i*3+2]=dir.z*(0.3+Math.random()*0.8);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
            const mat = new THREE.PointsMaterial({ size: 0.35, transparent:true, opacity:0.9 });
            const pts = new THREE.Points(geo, mat);
            pts.userData.life = 0.9;
            scene.add(pts);
            explosions.push(pts);
        }

        // HUD
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        let score = 0;
        let startTime = 0;

        // Game state
        let running = false;
        let paused = false;
        let lastFrame = 0;
        let shootTimer = 0;
        const shootInterval = 180; // ms
        let enemyTimer = 0;
        let enemyInterval = 800; // ms, will accelerate

        function startGame(){
            resetGame();
            running = true; paused = false;
            document.getElementById('overlay').classList.add('hidden');
            startTime = performance.now();
            lastFrame = startTime;
            loop(lastFrame);
        }

        function endGame(){
            running = false;
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('overlay').innerHTML = `
        <h1>游戏结束</h1>
        <p>得分：<strong>${score}</strong> · 存活时间：<strong>${timeEl.textContent.replace('Time: ','')}</strong></p>
        <button class="btn" id="restartBtn">重新开始</button>`;
            document.getElementById('restartBtn').addEventListener('click', ()=>{
                // restore overlay content then start
                document.getElementById('overlay').innerHTML = `
          <h1>3D 太空射击</h1>
          <p>使用 <strong>W/A/S/D</strong> 或 <strong>方向键</strong> 移动，武器自动射击。存活越久，得分越高！</p>
          <button id="startBtn" class="btn">开始游戏</button>`;
                document.getElementById('startBtn').addEventListener('click', startGame);
                startGame();
            });
        }

        function resetGame(){
            // remove enemies, bullets, explosions
            [...bullets, ...enemies, ...explosions].forEach(obj=>{ scene.remove(obj); if(obj.geometry) obj.geometry.dispose?.(); if(obj.material) {
                if(Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose?.()); else obj.material.dispose?.();
            }});
            bullets.length = 0; enemies.length = 0; explosions.length = 0;
            score = 0; scoreEl.textContent = 'Score: 0';
            timeEl.textContent = 'Time: 0.0s';
            enemyInterval = 800; enemyTimer = 0; shootTimer = 0;
            player.position.set(0,0,0);
        }

        function togglePause(){
            if(!running) return;
            paused = !paused;
            if(!paused){ lastFrame = performance.now(); loop(lastFrame); }
        }

        function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

        function update(dt){
            // parallax starfield
            stars.rotation.z += dt * 0.02;

            // Input movement
            const speed = 0.02 * dt * 60; // scaled
            let vx = 0, vy = 0;
            if(keys.ArrowLeft || keys.KeyA) vx -= speed;
            if(keys.ArrowRight || keys.KeyD) vx += speed;
            if(keys.ArrowUp || keys.KeyW) vy += speed;
            if(keys.ArrowDown || keys.KeyS) vy -= speed;
            player.position.x = clamp(player.position.x + vx, -bounds.x, bounds.x);
            player.position.y = clamp(player.position.y + vy, -bounds.y, bounds.y);
            player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -vx*0.08, 0.15);
            player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, vy*0.04, 0.15);

            // Auto shooting
            shootTimer += dt;
            if (shootTimer >= shootInterval){
                shootTimer = 0; spawnBullet();
            }

            // Update bullets
            for(let i=bullets.length-1;i>=0;i--){
                const b = bullets[i];
                b.position.z += b.userData.vz * (dt/16.67);
                if(b.position.z < -120){ scene.remove(b); bullets.splice(i,1); }
            }

            // Spawn enemies faster over time
            enemyTimer += dt;
            if(enemyTimer >= enemyInterval){
                enemyTimer = 0; spawnEnemy();
                enemyInterval = Math.max(280, enemyInterval * 0.985); // accelerate but keep a floor
            }

            // Update enemies
            for(let i=enemies.length-1;i>=0;i--){
                const e = enemies[i];
                e.position.z += e.userData.vz * (dt/16.67);
                e.position.x += e.userData.vx * (dt/16.67);
                e.position.y += e.userData.vy * (dt/16.67);
                e.rotation.x += 0.01; e.rotation.y += 0.008;

                // Player collision (game over)
                if(e.position.distanceTo(player.position) < 1.2){
                    spawnExplosion(player.position.clone());
                    endGame();
                    return; // stop update after game ends
                }

                // Remove if passed camera
                if(e.position.z > 35){ scene.remove(e); enemies.splice(i,1); }
            }

            // Bullet-Enemy collisions
            for(let i=enemies.length-1;i>=0;i--){
                const e = enemies[i];
                for(let j=bullets.length-1;j>=0;j--){
                    const b = bullets[j];
                    if(e.position.distanceTo(b.position) < 1.1){
                        // hit
                        spawnExplosion(e.position.clone());
                        scene.remove(e); enemies.splice(i,1);
                        scene.remove(b); bullets.splice(j,1);
                        score += 10; scoreEl.textContent = `Score: ${score}`;
                        break;
                    }
                }
            }

            // Explosions fade
            for(let i=explosions.length-1;i>=0;i--){
                const p = explosions[i];
                const pos = p.geometry.getAttribute('position');
                const vel = p.geometry.getAttribute('velocity');
                for(let k=0;k<pos.count;k++){
                    pos.array[k*3+0] += vel.array[k*3+0];
                    pos.array[k*3+1] += vel.array[k*3+1];
                    pos.array[k*3+2] += vel.array[k*3+2];
                    vel.array[k*3+0] *= 0.96; vel.array[k*3+1] *= 0.96; vel.array[k*3+2] *= 0.96;
                }
                pos.needsUpdate = true;
                p.material.opacity *= 0.92;
                p.userData.life -= dt/1000;
                if(p.userData.life <= 0){ scene.remove(p); p.geometry.dispose(); p.material.dispose(); explosions.splice(i,1); }
            }

            // Update HUD time
            const elapsed = (performance.now() - startTime) / 1000;
            timeEl.textContent = `Time: ${elapsed.toFixed(1)}s`;
        }

        function loop(now){
            if(!running || paused) return;
            const dt = Math.min(50, now - lastFrame); // clamp dt
            lastFrame = now;
            update(dt);
            renderer.render(scene, camera);
            requestAnimationFrame(loop);
        }

        // Resize
        function onResize(){
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h);
            camera.aspect = w/h; camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', onResize);

        // Start button
        const overlay = document.getElementById('overlay');
        document.getElementById('startBtn').addEventListener('click', startGame);

        // Safety: pause when tab hidden
        document.addEventListener('visibilitychange', ()=>{ if(document.hidden) paused = true; });
    })();
</script>
</body>
</html>
